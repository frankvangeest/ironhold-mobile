# Workflow 2 of 2: harmless probe on the `heavy` agent (LXC 116 on pmve02). Proves routing, the wake dependency and the
# resources of the build host. Deploys and publishes nothing. Replace with the real build once a spike exists.
#
# `labels: label: heavy` is what routes this to the heavy agent; that agent has the MANDATORY label `!label=heavy`, so
# workflows without it (site deploys etc.) never run on pmve02. `depends_on: [wake]` waits for wake.yml to succeed.
when:
  event: [push, manual]
  branch: main

labels:
  label: heavy

depends_on:
  - wake

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      skip_verify: true

steps:
  probe:
    image: rust:1-bookworm
    commands:
      - echo "running on $(hostname)"
      - cargo --version
      - nproc
      - free -m
      - df -h /
      # Cache proof: the agent mounts three named volumes into every step. First run must say MISS, every later run HIT
      # with the timestamp of the previous run. (Marker files only, nothing is built.)
      - mount | grep -E "/usr/local/cargo/(registry|git)|/cache/target" | awk '{print "mounted:", $3}'
      - mkdir -p /cache/target/probe /usr/local/cargo/registry
      - if [ -f /cache/target/probe/marker ]; then echo "CACHE HIT, previous run was at $(cat /cache/target/probe/marker)"; else echo "CACHE MISS (first run)"; fi
      - date -u > /cache/target/probe/marker
      - if [ -f /usr/local/cargo/registry/probe-marker ]; then echo "REGISTRY HIT"; else echo "REGISTRY MISS (first run)"; fi
      - date -u > /usr/local/cargo/registry/probe-marker
